name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-unit:
    name: 文档契约 + 单元层
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        # numpy：语义检索测试（R251/R252/R257）在模块级 import，缺了会在收集期中断整个单元层；
        # 产品打包 spec 把它当可选依赖排除，所以 CI 必须显式装
        run: pip install PySide6 PySide6-Fluent-Widgets pytest numpy
      - name: 工具示例 × schema 漂移审计
        run: python tools/audit_tool_docs.py
      - name: 单元层
        run: python -m pytest tests/unit -q
      - name: 空 HOME 冒烟（防依赖开发机配置，B018）
        # R764：HOME/USERPROFILE 指到临时目录并预埋毒配置——读了本机用户配置的用例
        # 会拿到毒值当场红（R754 同族回归）。本地同一命令即可复现。
        run: python tools/empty_home_smoke.py
      - name: 首启/根目录失效探针（R771，R773 进门禁）
        # 三种真实开机态各起一次真窗口：无配置要落在设置页；配置的盘不在必须报
        # 「根目录不存在」且设置页显示「目录不可用」；空目录必须跑完一次扫描。
        # 探针自带临时 HOME 与 offscreen，约 20s，不依赖开发机状态。
        run: python tools/root_boot_probe.py --out root-boot-ci

  full:
    name: 三层门禁（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install PySide6 PySide6-Fluent-Widgets pytest numpy
      - name: unit / gui / e2e
        run: python tests/run_all.py
